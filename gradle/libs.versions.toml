[versions]
# Build toolchain
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
spotless = "8.11.0"
ktlint = "1.8.0"
composeRulesKtlint = "0.6.8"

# AndroidX / Compose
composeBom = "2026.09.00"
material3Expressive = "1.5.0-beta02"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
